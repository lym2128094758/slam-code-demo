controller_frequency: 10

DWAPlannerROS:
  # odom_topic: /odom
  odom_topic: /odom
  holonomic_robot: false
  transform_tolerance: 1.0
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.3
  latch_xy_goal_tolerance: true

  use_dwa: true
  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.1
  vx_samples: 20
  vy_samples: 1
  vth_samples: 20

  goal_distance_bias: 24.0
  scaling_speed: 0.25

  acc_lim_trans: 0.3
  acc_lim_x: 2.0
  acc_lim_y: 0.0
  acc_lim_theta: 1.0

  max_vel_trans: 0.4
  min_vel_trans: 0.05
  max_vel_x: 1.5
  min_vel_x: -0.13
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.8
  min_vel_theta: -0.8

  oscillation_reset_dist: 0.2
  publish_traj_pc: true
  publish_cost_grid_pc: true
  occdist_scale: 0.05
  path_distance_bias: 80.0
  # global_frame_id: odom
  global_frame_id: odom
  penalize_negative_x: false
