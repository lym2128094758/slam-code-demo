local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  # global_frame: my_odom
  # robot_base_frame: my_base_link
  update_frequency: 10.0
  publish_frequency: 10.0
  transform_tolerance: 0.5
  static_map: false
  rolling_window: true
  width: 10
  height: 10
  resolution: 0.05

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: scan
    scan:
      # sensor_frame: radar
      sensor_frame: radar
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      obstacle_range: 5.0
      raytrace_range: 5.5

  inflation_layer:
    enabled: true
    inflation_radius: 0.4
    cost_scaling_factor: 0.4
